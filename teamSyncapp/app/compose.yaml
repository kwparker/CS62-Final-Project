services:
  postgres:
    image: 'postgres:15'
    container_name: teamsync-postgres
    environment:
      - 'POSTGRES_DB=teamSync-db'
      - 'POSTGRES_PASSWORD=teamSyncPass'
      - 'POSTGRES_USER=teamSyncUser'
    ports:
      - '5432:5432'
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
